[package]
name = "opendaw-core"
version.workspace = true
edition.workspace = true
description = "OpenDAW 核心胶水层 - 统一入口，组合所有crate"

[lib]
name = "opendaw_core"
crate-type = ["lib", "cdylib"]

[dependencies]
opendaw-extension = { path = "../opendaw-extension" }
audio-engine = { path = "../audio-engine" }
plugin-host = { path = "../plugin-host" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1"
parking_lot = "0.12"
flate2 = "1"

[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
optional = true

[dev-dependencies]
log = "0.4"
env_logger = "0.11"

[features]
default = []
python = ["dep:pyo3"]

[[example]]
name = "plugin_chain_demo"
path = "examples/plugin_chain_demo.rs"
