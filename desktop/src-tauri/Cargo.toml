[package]
name = "opendaw-desktop"
version.workspace = true
description = "OpenDAW — AI-native open-source DAW (Tauri desktop shell)"
authors = ["OpenDAW Team"]
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
ctrlc = "3"
urlencoding = "2"
opendaw-core = { path = "../../opendaw-core" }
audio-engine = { path = "../../audio-engine", features = ["channel"] }
opendaw-extension = { path = "../../opendaw-extension" }
parking_lot = "0.12"
cpal = "0.15"
crossbeam-channel = "0.5"
once_cell = "1"

[lib]
name = "opendaw_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "opendaw-desktop"
path = "src/main.rs"
