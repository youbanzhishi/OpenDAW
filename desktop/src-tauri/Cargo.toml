[package]
name = "opendaw-desktop"
version = "1.0.1"
description = "OpenDAW — AI-native open-source DAW (Tauri desktop shell)"
authors = ["OpenDAW Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
ctrlc = "3"
opendaw-core = { path = "../../opendaw-core" }
audio-engine = { path = "../../audio-engine" }

[lib]
name = "opendaw_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "opendaw-desktop"
path = "src/main.rs"
