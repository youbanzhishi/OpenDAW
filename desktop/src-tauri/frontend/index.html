<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCMix — Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; background: #1a1a2e; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        .loader {
            text-align: center; padding: 40px;
        }
        .spinner {
            width: 48px; height: 48px; margin: 0 auto 24px;
            border: 4px solid rgba(233, 69, 96, 0.2);
            border-top-color: #e94560; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; margin-bottom: 8px; color: #e94560; }
        p { font-size: 14px; color: #888; }
        .error { color: #e94560; display: none; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>VCMix</h1>
        <p id="status">Starting backend...</p>
        <p class="error" id="error"></p>
    </div>
    <script>
        const BACKEND_URL = 'http://localhost:8000';
        const MAX_ATTEMPTS = 60;
        const INTERVAL_MS = 1000;
        let attempts = 0;

        function checkBackend() {
            fetch(BACKEND_URL + '/api/health')
                .then(r => {
                    if (r.ok) {
                        document.getElementById('status').textContent = 'Backend ready, redirecting...';
                        window.location.href = BACKEND_URL;
                    } else {
                        throw new Error('Not ready');
                    }
                })
                .catch(() => {
                    attempts++;
                    if (attempts >= MAX_ATTEMPTS) {
                        document.getElementById('status').style.display = 'none';
                        document.querySelector('.spinner').style.display = 'none';
                        const err = document.getElementById('error');
                        err.textContent = 'Failed to connect to backend. Please ensure VCMix is running.';
                        err.style.display = 'block';
                        return;
                    }
                    document.getElementById('status').textContent =
                        'Waiting for backend... (' + attempts + '/' + MAX_ATTEMPTS + ')';
                    setTimeout(checkBackend, INTERVAL_MS);
                });
        }

        checkBackend();
    </script>
</body>
</html>
