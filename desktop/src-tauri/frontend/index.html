<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OpenDAW — AI-native DAW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Top Transport Bar ──────────────────────────────────────────── -->
<header id="transport-bar">
    <div class="transport-left">
        <div class="logo">OpenDAW</div>
        <div class="project-selector">
            <select id="project-select" title="Select project">
                <option value="">— Select Project —</option>
            </select>
            <button id="btn-new-project" class="icon-btn" title="New Project">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>

    <div class="transport-center">
        <button id="btn-rewind" class="transport-btn" title="Rewind (Home)">
            <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9l8-6v12zM1 4v10" fill="currentColor"/></svg>
        </button>
        <button id="btn-play" class="transport-btn primary" title="Play / Pause (Space)">
            <svg id="icon-play" width="18" height="18" viewBox="0 0 18 18"><path d="M5 3l10 6-10 6z" fill="currentColor"/></svg>
            <svg id="icon-pause" width="18" height="18" viewBox="0 0 18 18" style="display:none"><path d="M4 3h3v12H4zM11 3h3v12h-3z" fill="currentColor"/></svg>
        </button>
        <button id="btn-stop" class="transport-btn" title="Stop">
            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="4" y="4" width="10" height="10" fill="currentColor"/></svg>
        </button>
        <button id="btn-record" class="transport-btn danger" title="Record (R)">
            <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="5" fill="currentColor"/></svg>
        </button>
        <button id="btn-loop" class="transport-btn" title="Loop">
            <svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 7h8a3 3 0 010 6H7M7 7l-3-3 3-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-metronome" class="transport-btn" title="Metronome">
            <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2l5 13H4zM9 2v4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        </button>

        <div class="time-display" id="time-display">
            <span class="time-value">00:00:00.000</span>
        </div>

        <div class="bpm-control">
            <label>BPM</label>
            <input type="number" id="bpm-input" value="120" min="20" max="300" step="1">
        </div>

        <div class="time-sig-control">
            <select id="time-sig-select">
                <option value="4/4">4/4</option>
                <option value="3/4">3/4</option>
                <option value="6/8">6/8</option>
                <option value="5/4">5/4</option>
            </select>
        </div>
    </div>

    <div class="transport-right">
        <div class="audio-controls">
            <button id="btn-load-wav" class="action-btn" title="Load Audio">
                <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="btn-label">Load</span>
            </button>
            <div class="volume-control">
                <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5h2l3-3v10l-3-3H2zM10 5a3 3 0 010 4M11.5 3a6 6 0 010 8" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
                <input type="range" id="volume-slider" min="-60" max="12" value="0" step="1" title="Master Volume">
                <span id="volume-display">0 dB</span>
            </div>
        </div>
        <div class="backend-status" id="backend-status">
            <span class="dot offline"></span>
            <span class="status-text">Connecting…</span>
        </div>
        <button id="btn-import-project">📥 Import DAW</button>
                <button id="btn-export" class="action-btn primary" title="Export (Ctrl+E)">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-label">Export</span>
        </button>
    </div>
</header>

<!-- ── Main DAW Layout ──────────────────────────────────────────────── -->
<div id="daw-main">

    <!-- Left: Track List -->
    <aside id="track-panel">
        <div class="panel-header">
            <span class="panel-title">TRACKS</span>
            <div class="panel-actions">
                <button id="btn-add-track" class="icon-btn sm" title="Add Track (Ctrl+N)">
                    <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
        <div id="track-list">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 48 48"><path d="M24 8v24M16 20l8 8 8-8M12 36h24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/></svg>
                <p>No tracks yet</p>
                <p class="hint">Tap + or drag audio here</p>
            </div>
        </div>
    </aside>

    <!-- Center: Arrangement / Timeline -->
    <main id="arrangement">
        <div id="timeline-ruler">
            <canvas id="ruler-canvas"></canvas>
        </div>
        <div id="arrangement-body">
            <canvas id="arrangement-canvas"></canvas>
            <div id="playhead"></div>
            <div id="selection-overlay"></div>
        </div>
    </main>

    <!-- Right: Inspector -->
    <aside id="inspector-panel">
        <div class="panel-header">
            <span class="panel-title">INSPECTOR</span>
        </div>
        <div id="inspector-content">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 48 48"><rect x="8" y="4" width="32" height="40" rx="3" stroke="currentColor" stroke-width="2" fill="none" opacity="0.3"/><path d="M16 16h16M16 22h12M16 28h8" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/></svg>
                <p>Select a track or clip</p>
            </div>
        </div>
    </aside>
</div>

<!-- ── Bottom: Mixer Panel ─────────────────────────────────────────── -->
<div id="mixer-panel">
    <div class="mixer-header">
        <button id="btn-mixer-toggle" class="icon-btn" title="Toggle Mixer (Ctrl+M)">
            <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="panel-title">MIXER</span>
        <div class="mixer-actions">
            <button id="btn-mixer-expand" class="icon-btn sm" title="Expand Mixer">
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8M6 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>
    <div id="mixer-strips-container">
        <div id="mixer-strips">
            <!-- Channel strips injected by JS -->
        </div>
        <div class="master-strip" id="master-strip">
            <div class="strip-label">MASTER</div>
            <div class="strip-meter">
                <div class="meter-bar" id="master-meter-L"></div>
                <div class="meter-bar" id="master-meter-R"></div>
            </div>
            <div class="fader-wrap">
                <input type="range" class="fader-v" id="master-fader" min="-60" max="12" value="0" step="0.5" orient="vertical">
            </div>
            <div class="fader-dB" id="master-dB">0.0</div>
        </div>
    </div>
</div>

<!-- ── Virtual Piano Keyboard (mobile) ─────────────────────────────── -->
<div id="piano-keyboard" class="hidden">
    <div class="piano-header">
        <button id="btn-piano-close" class="icon-btn sm">
            <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <span class="panel-title">KEYBOARD</span>
        <div class="piano-controls">
            <select id="piano-octave">
                <option value="3">C3</option>
                <option value="4" selected>C4</option>
                <option value="5">C5</option>
                <option value="6">C6</option>
            </select>
        </div>
    </div>
    <div id="piano-keys"></div>
</div>

<!-- ── Status Bar ─────────────────────────────────────────────────── -->
<footer id="app-status">
    <span id="status-msg">Ready</span>
    <span class="shortcut-hint">
        Space: Play/Stop · Home: Rewind · Ctrl+E: Export · Ctrl+M: Mixer · Ctrl+K: Chat
    </span>
</footer>

<!-- ── Toast Notifications ───────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Scripts (ES modules) ───────────────────────────────────────── -->
<script src="utils/theme.js"></script>
<script src="utils/layout.js"></script>
<script src="utils/tauri-bridge.js"></script>
<script src="canvas/timeline.js"></script>
<script src="canvas/waveform.js"></script>
<script src="canvas/midi-block.js"></script>
<script src="components/transport.js"></script>
<script src="components/track-list.js"></script>
<script src="components/arrangement.js"></script>
<script src="components/mixer.js"></script>
<script src="components/inspector.js"></script>
<script src="components/piano-keyboard.js"></script>
<script src="components/touch-handler.js"></script>
<script src="app.js"></script>

</body>
</html>
