# ── VCMix 最简测试项目 ──────────────────────────────────────
# 用于验证基本渲染流程：1轨 + 1效果器 + Master

name: "Simple Test"
bpm: 120
sample_rate: 44100

tracks:
  - name: vocal
    file: "test_vocal.wav"
    volume: 0.9
    effects:
      - name: vc-gain
        params:
          gain: 3

master:
  levels:
    vocal: 1.0
  effects: []
  output: "test_output.wav"
