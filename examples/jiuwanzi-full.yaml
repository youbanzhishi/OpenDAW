# ── VCMix 示例项目：《九万字》完整混音配置 ──────────────────────
# 包含Master处理链的完整版本
# BPM=62, 人声全链路 + 伴奏EQ + Master Comp+Limiter

name: "九万字-Full"
bpm: 62
sample_rate: 44100

tracks:
  - name: vocal
    file: "vocal_dry.wav"
    volume: 1.0
    effects:
      - name: vc-deesser
        params:
          threshold: -40
          reduction: -6

      - name: vc-gain
        params:
          gain: 6

      - name: vc-eq
        params:
          low_cut: 80
          high_shelf: 8000
          peak_gain: -3

      - name: vc-comp
        params:
          threshold: -30
          ratio: 2.5
          attack: 5
          release: 50

      - name: vc-saturator
        params:
          drive: 20
          mix: 15

      - name: vc-reverb
        params:
          room: 30
          decay: 35
          damping: 50
          mix: 10
          predelay: 50
          wetlpf: 5000

      - name: vc-delay
        params:
          time: "1/8d"      # 181.5ms @BPM62
          feedback: 12
          mix: 5

      - name: vc-limiter
        params:
          ceiling: -1

  - name: accomp
    file: "accomp.wav"
    volume: 1.0
    effects:
      # 伴奏也做轻微EQ处理
      - name: vc-eq
        params:
          low_cut: 40
          high_shelf: 12000
          peak_gain: -1

master:
  levels:
    vocal: 0.8
    accomp: 0.35
  effects:
    # Master压缩 — 胶水感
    - name: vc-comp
      params:
        threshold: -18
        ratio: 1.5
        attack: 10
        release: 100
        makeup: 2

    # Master限幅 — 最终安全
    - name: vc-limiter
      params:
        ceiling: -1
        release: 50
  output: "jiuwanzi_full_mix.wav"
