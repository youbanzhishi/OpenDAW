[package]
name = "opendaw-extension"
version = "0.1.0"
edition = "2021"
description = "OpenDAW 扩展注册中心 - Plugin API + Script Runtime + Model Bus + Hook System"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
uuid = { version = ">=1.6, <1.10", features = ["v4"] }
getrandom = "0.2"

