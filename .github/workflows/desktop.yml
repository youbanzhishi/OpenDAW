name: Desktop Build

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Cargo Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Rust installation
        run: |
          cargo --version
          rustc --version
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libgtk-3-dev libglib2.0-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Cargo check (fast fail)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  build:
    name: Build Desktop (${{ matrix.target }})
    needs: check
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      # macOS deployment target: support macOS 10.15+ (Catalina)
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add macOS universal binary targets
        if: matrix.target == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          echo "Installed targets:"
          rustup target list --installed
      - name: Verify Rust installation
        shell: bash
        run: |
          rustup show
          cargo --version
          rustc --version
      - name: Cache Rust dependencies (platform-specific)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          prefix-key: v1-rust-${{ matrix.platform }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libgtk-3-dev libglib2.0-dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare frontend dist
        shell: bash
        run: |
          echo "Frontend dist (uses desktop/src-tauri/frontend/ — the full OpenDAW DAW UI):"
          ls -la desktop/src-tauri/frontend/
          echo "Checking critical files:"
          test -f desktop/src-tauri/frontend/index.html && echo "  ✅ index.html" || echo "  ❌ index.html MISSING"
          test -f desktop/src-tauri/frontend/style.css && echo "  ✅ style.css" || echo "  ❌ style.css MISSING"
          test -f desktop/src-tauri/frontend/app.js && echo "  ✅ app.js" || echo "  ❌ app.js MISSING"
          test -d desktop/src-tauri/frontend/canvas && echo "  ✅ canvas/ (DAW components)" || echo "  ⚠️ canvas/ missing (basic UI only)"
      - name: Install desktop npm dependencies
        working-directory: desktop
        shell: bash
        run: npm install
      - name: Build Python backend venv (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          echo "=== Building Python backend venv ==="
          python3 --version || { echo "Python3 not found!"; exit 1; }
          echo "Creating venv..."
          python3 -m venv desktop/backend-venv
          desktop/backend-venv/bin/pip install --upgrade pip setuptools wheel
          echo "Installing Python dependencies..."
          desktop/backend-venv/bin/pip install \
            numpy>=1.24.0 \
            soundfile>=0.12.0 \
            scipy>=1.10.0 \
            pyyaml>=6.0 \
            pydantic>=2.0 \
            mido>=1.3.0 \
            fastapi>=0.100.0 \
            uvicorn>=0.20.0 \
            websockets>=11.0 \
            python-multipart>=0.0.6 \
            sounddevice>=0.4.0 \
            librosa>=0.10.0
          echo "Installing vcmix (editable, src-layout)..."
          desktop/backend-venv/bin/pip install -e . --no-deps
          desktop/backend-venv/bin/python -c "import vcmix; print(f'vcmix {vcmix.__version__} OK')"
          echo "Venv size: $(du -sh desktop/backend-venv/ | cut -f1)"
          echo "✅ Venv ready"
      - name: Build Python backend venv (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          echo "=== Building Python backend venv (Linux) ==="
          python3 --version || { echo "Python3 not found!"; exit 1; }
          python3 -m venv desktop/backend-venv
          desktop/backend-venv/bin/pip install --upgrade pip
          desktop/backend-venv/bin/pip install \
            numpy>=1.24.0 soundfile>=0.12.0 scipy>=1.10.0 \
            pyyaml>=6.0 pydantic>=2.0 mido>=1.3.0 \
            fastapi>=0.100.0 uvicorn>=0.20.0 websockets>=11.0 \
            python-multipart>=0.0.6 sounddevice>=0.4.0 librosa>=0.10.0
          desktop/backend-venv/bin/pip install -e . --no-deps
          desktop/backend-venv/bin/python -c "import vcmix; print(f'vcmix {vcmix.__version__} installed')"
          echo "✅ Python backend venv ready"
      - name: Build Python backend venv (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          echo "=== Building Python backend venv (Windows) ==="
          python --version || python3 --version || { echo "Python not found!"; exit 1; }
          PYBIN=$(command -v python || command -v python3)
          "$PYBIN" -m venv desktop/backend-venv
          desktop/backend-venv/Scripts/pip install --upgrade pip
          desktop/backend-venv/Scripts/pip install \
            numpy>=1.24.0 soundfile>=0.12.0 scipy>=1.10.0 \
            pyyaml>=6.0 pydantic>=2.0 mido>=1.3.0 \
            fastapi>=0.100.0 uvicorn>=0.20.0 websockets>=11.0 \
            python-multipart>=0.0.6 sounddevice>=0.4.0 librosa>=0.10.0
          desktop/backend-venv/Scripts/pip install -e . --no-deps
          echo "✅ Python backend venv ready"
      - name: Build Tauri app (macOS universal)
        if: matrix.target == 'macos'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('OpenDAW Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Cross-platform desktop build for macOS (universal: Intel + Apple Silicon)'
          releaseDraft: true
          prerelease: false
          args: '--target universal-apple-darwin'
      - name: Build Tauri app (non-macOS)
        if: matrix.target != 'macos'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('OpenDAW Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Cross-platform desktop build for ${{ matrix.target }}'
          releaseDraft: true
          prerelease: false
      - name: Verify build artifacts (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          echo "Verifying Linux artifacts..."
          find target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) | head -5
          test -n "$(find target/release/bundle -type f -name '*.AppImage' 2>/dev/null)" && echo "✅ AppImage found" || echo "⚠️ No AppImage"
      - name: Verify build artifacts (macOS universal)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          echo "Verifying macOS universal artifacts..."
          find target/universal-apple-darwin/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) 2>/dev/null | head -5 || \
          find target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) | head -5
          # Check binary architectures
          APP_PATH=$(find target/universal-apple-darwin/release/bundle/macos -name "OpenDAW.app" 2>/dev/null || find target/release/bundle/macos -name "OpenDAW.app" 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Checking binary architectures in: $APP_PATH"
            lipo -archs "$APP_PATH/Contents/MacOS/OpenDAW" 2>/dev/null || echo "Could not check architectures"
          fi
          test -n "$(find target -name '*.dmg' 2>/dev/null)" && echo "✅ DMG found" || echo "⚠️ No DMG"
      - name: Verify build artifacts (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          echo "Verifying Windows artifacts..."
          find target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) | head -5
          test -n "$(find target/release/bundle -name '*.exe' -path '*/nsis/*' 2>/dev/null)" && echo "✅ NSIS exe found" || echo "⚠️ No NSIS exe"
      - name: Upload artifact (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
      - name: Upload artifact (macOS universal)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-macos-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
      - name: Upload artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
