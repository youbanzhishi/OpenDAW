name: Desktop Build

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Cargo Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Rust installation
        run: |
          cargo --version
          rustc --version
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libgtk-3-dev libglib2.0-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Cargo check (fast fail)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  build:
    name: Build Desktop (${{ matrix.target }})
    needs: check
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      # macOS deployment target: support macOS 10.15+ (Catalina)
      MACOSX_DEPLOYMENT_TARGET: "10.15" 

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Rust installation
        shell: bash
        run: |
          rustup show
          cargo --version
          rustc --version
      - name: Cache Rust dependencies (platform-specific)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          prefix-key: v1-rust-${{ matrix.platform }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libgtk-3-dev libglib2.0-dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare frontend dist
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/frontend
          cp desktop/src/index.html desktop/src-tauri/frontend/
          cp desktop/src/style.css desktop/src-tauri/frontend/
          cp desktop/src/app.js desktop/src-tauri/frontend/ 2>/dev/null || true
          echo "Frontend dist prepared:"
          ls -la desktop/src-tauri/frontend/
      - name: Install desktop npm dependencies
        working-directory: desktop
        shell: bash
        run: npm install
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('OpenDAW Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Cross-platform desktop build for ${{ matrix.target }}'
          releaseDraft: true
          prerelease: false
      - name: Verify build artifacts (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          echo "Verifying Linux artifacts..."
          find target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) | head -5
          test -n "$(find target/release/bundle -type f -name '*.AppImage' 2>/dev/null)" && echo "✅ AppImage found" || echo "⚠️ No AppImage"
      - name: Verify build artifacts (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          echo "Verifying macOS artifacts..."
          find target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) | head -5
          test -n "$(find target/release/bundle -type f -name '*.dmg' 2>/dev/null)" && echo "✅ DMG found" || echo "⚠️ No DMG"
      - name: Verify build artifacts (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          echo "Verifying Windows artifacts..."
          find target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) | head -5
          test -n "$(find target/release/bundle -name '*.exe' -path '*/nsis/*' 2>/dev/null)" && echo "✅ NSIS exe found" || echo "⚠️ No NSIS exe"
      - name: Upload artifact (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
      - name: Upload artifact (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
      - name: Upload artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

