name: Desktop Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows
      fail-fast: false
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          prefix: ${{ matrix.platform }}-
          cache-on-failure: true

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare frontend dist
        shell: bash
        run: |
          # Copy Python web static files as Tauri frontend dist
          mkdir -p desktop/src-tauri/frontend
          cp src/vcmix/web/static/index.html desktop/src-tauri/frontend/
          cp src/vcmix/web/static/style.css desktop/src-tauri/frontend/
          cp src/vcmix/web/static/app.js desktop/src-tauri/frontend/ 2>/dev/null || true
          echo "Frontend dist prepared:"
          ls -la desktop/src-tauri/frontend/

      - name: Install desktop npm dependencies
        working-directory: desktop
        shell: bash
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('VCMix Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Cross-platform desktop build for ${{ matrix.target }}'
          releaseDraft: true
          prerelease: false

      - name: Upload artifact (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: vcmix-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload artifact (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: vcmix-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app

      - name: Upload artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: vcmix-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
