name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-core:
    name: Build & Push (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and push core image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VCMIX_PROFILE=core
            OPENDAW_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vcmix:core-${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/vcmix:core-latest
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
      - name: Smoke test core
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/vcmix:core-latest python -m vcmix.cli --help

  build-full:
    name: Build & Push (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and push full image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VCMIX_PROFILE=full
            OPENDAW_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vcmix:full-${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/vcmix:full-latest
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
      - name: Smoke test full
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/vcmix:full-latest python -c "import torch; print(torch.__version__)"
          docker run --rm ghcr.io/${{ github.repository_owner }}/vcmix:full-latest python -c "import demucs"
