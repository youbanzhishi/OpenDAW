name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (core or full)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - core
          - full

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push (${{ matrix.profile }})
    strategy:
      matrix:
        include:
          - profile: core
          - profile: full
      fail-fast: false
    runs-on: ubuntu-latest

    # 手动触发时，如果选了core或full，只构建对应的
    if: |
      github.event_name == 'push' ||
      inputs.profile == 'both' ||
      inputs.profile == matrix.profile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VCMIX_PROFILE=${{ matrix.profile }}
            OPENDAW_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/vcmix:${{ matrix.profile }}-${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/vcmix:${{ matrix.profile }}-latest
          labels: |
            org.opencontainers.image.title=VCMix
            org.opencontainers.image.description=VCMix ${{ matrix.profile }} profile
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
          # core模式限制内存使用
          options: |
            --memory=6g
