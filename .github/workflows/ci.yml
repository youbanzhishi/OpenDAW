name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check --workspace --exclude opendaw-desktop --exclude desktop
      - run: cargo test --workspace --exclude opendaw-desktop --exclude desktop
      - name: Check formatting (non-desktop packages)
        run: |
          cargo fmt --check -p audio-engine -p jsfx-engine -p opendaw-extension -p opendaw-core -p plugin-host -p opendaw-api -p opendaw-ws -p opendaw-cli
