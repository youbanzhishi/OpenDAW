name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check (opendaw-core)
        run: cargo check -p opendaw-core

      - name: Cargo check (opendaw-api)
        run: cargo check -p opendaw-api

      - name: Cargo check (opendaw-cli)
        run: cargo check -p opendaw-cli

      - name: Run tests (opendaw-core only)
        run: cargo test -p opendaw-core

      - name: Clippy
        run: cargo clippy -p opendaw-core -p opendaw-api -p opendaw-cli -- -D warnings

      - name: Format check
        run: cargo fmt --check
