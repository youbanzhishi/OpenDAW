name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # CLI 构建
  build-cli:
    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: opendaw
            asset_name: opendaw-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: opendaw
            asset_name: opendaw-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: opendaw
            asset_name: opendaw-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: opendaw.exe
            asset_name: opendaw-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release -p opendaw-cli --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: cd target/${{ matrix.target }}/release && tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: cd target/${{ matrix.target }}/release && 7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip

  # Desktop (Tauri) 构建
  build-desktop:
    name: Build Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Add Rust targets for universal binary
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libgtk-3-dev libglib2.0-dev
      - name: Install frontend dependencies
        run: cd desktop && npm install
      - name: Build Tauri app (no auto-release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # 不自动创建release，只构建并上传artifact
          includeRelease: false
          includeUpdater: false
      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-desktop-macos
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: opendaw-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm

  # 统一发布
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Create tag for release
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          git tag $TAG
          git push origin $TAG
          echo "tag_name=$TAG" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: List artifacts
        run: find artifacts/ -type f | head -30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
