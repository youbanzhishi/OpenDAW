# ============================================================
# OpenDAW Docker Compose 配置
# ============================================================
# 使用方法：
#   1. 复制 .env.example 为 .env，按需修改
#   2. docker compose up -d --build
#   3. 浏览器访问 http://你的IP:8080
# ============================================================

version: "3.8"

services:
  opendaw:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: opendaw-server

    # ── 端口映射 ──────────────────────────────────────────
    # 左边是宿主机端口（改这个），右边是容器内端口（别动）
    ports:
      - "${OPENDAW_PORT:-8080}:8080"

    # ── 数据卷挂载 ────────────────────────────────────────
    volumes:
      - ${OPENDAW_PROJECTS_DIR:-./projects}:/app/projects
      - ${OPENDAW_OUTPUT_DIR:-./output}:/app/output

    # ── 环境变量 ──────────────────────────────────────────
    environment:
      - RUST_LOG=${OPENDAW_LOG_LEVEL:-opendaw_api=debug,info}
      - OPENDAW_WEB_DIR=/app/static

    # ── 资源限制 ──────────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: ${OPENDAW_MEMORY_LIMIT:-1G}
          cpus: "${OPENDAW_CPU_LIMIT:-2.0}"
        reservations:
          memory: 256M
          cpus: "0.5"

    # ── 重启策略 ──────────────────────────────────────────
    restart: unless-stopped

    # ── 健康检查 ──────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/projects"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ── 日志配置 ──────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
