[package]
name = "opendaw-cli"
version = "0.31.0"
edition = "2021"
description = "OpenDAW CLI Shell — 命令行界面"

[[bin]]
name = "opendaw"
path = "src/main.rs"

[dependencies]
opendaw-core = { path = "../../opendaw-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
colored = "2"
uuid = { version = ">=1.6, <1.10", features = ["v4"] }
thiserror = "1"
