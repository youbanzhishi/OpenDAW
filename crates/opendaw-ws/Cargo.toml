[package]
name = "opendaw-ws"
version.workspace = true
edition.workspace = true
description = "OpenDAW WebSocket 实时通信层"

[lib]
name = "opendaw_ws"
path = "src/lib.rs"

[dependencies]
opendaw-core = { path = "../../opendaw-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = ">=1.6, <1.10", features = ["v4", "serde"] }
futures-util = "0.3"
tracing = "0.1"
thiserror = "1"
