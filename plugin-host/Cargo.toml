[package]
name = "plugin-host"
version.workspace = true
edition.workspace = true
description = "OpenDAW 插件宿主 - 加载/管理/调度插件链，支持 VST3/CLAP/VC-Plugin 多格式"

[dependencies]
opendaw-extension = { path = "../opendaw-extension" }
phase-cancel = { path = "../phase-cancel" }
audio-engine = { path = "../audio-engine" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
log = "0.4"
tempfile = "3"

clack-host = { version = "0.1", optional = true }
jsfx-engine = { path = "../jsfx-engine", optional = true }

[dev-dependencies]
env_logger = "0.11"

[features]
default = []
clap = ["dep:clack-host"]
vst3 = []
jsfx = ["dep:jsfx-engine"]

[[example]]
name = "vc_plugin_demo"
path = "examples/vc_plugin_demo.rs"

[[example]]
name = "jsfx_e2e"
path = "examples/jsfx_e2e.rs"
required-features = ["jsfx"]
