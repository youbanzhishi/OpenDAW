[project]
name = "vcmix"
version = "0.24.0"
description = "AI-native DAW — VCMix"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "eval_type_backport>=0.2",
    "pydantic>=2.0",
    "mido>=1.3.0",
    "rich>=13.0",
    "click>=8.0",
    "librosa>=0.10.0",
    "python-multipart>0.0.6",
]

[project.optional-dependencies]
web = ["fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",]
ai = [
    "demucs>=4.0",
]
audio = [
    "sounddevice>=0.4.0",
    "mido>=1.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    "httpx>=0.24.0",
]
all = [
    "vcmix[web,ai,audio]",
]

[project.scripts]
vcmix = "vcmix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcmix = [
    "web/static/**/*",
    "presets/**/*.yaml",
]

[tool.ruff]
line-length = 240
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
